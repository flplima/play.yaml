        - "{[c#6 a5 e5] _ _ _ _ _ _ d6} {[c#6 a5 e5] _ _ _ _ _ _ d6} {[c#6 a5 e5] _ _ _ _ _ _ d6} [c#6 a5 e5]"
        - "{b5 _ _ e6}"
