        - "1/4"
        - "{~ {~ ~ ~ ~ ~ a2 c#3 e3}}"
        - "2/4"
        - "{a3> a3} {a3 {a3 _ _ _ _ a2 c#3 e3}}"
        - "{a3> a3} {a3 {a3 _ _ _ _ d2 f#2 a2}}"
        - "{d3> {d3 _ _ _ _ d#2 f#2 a2}} {d#3> {d#3 _ _ _ _ e2 g#2 b2}}"
