    right2:
      play:
        - "2/4"
        - "~ c#5"
    left:
      play:
        - "2/4"
        - "{a3> a3} {a3 {a3 _ _ _ _ a2 c#3 e3}}"
  finale:   # the last march and the close
    loop: false
    right:
      play:
