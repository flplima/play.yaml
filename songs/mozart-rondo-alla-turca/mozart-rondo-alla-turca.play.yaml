        - "{f#4 f#5 g#4 g#5} {a4 a5 b4 b5}"
        - "{g#4 g#5 e4 e5} {a4 a5 b4 b5}"
        - "{c#5> c#6 ~:} {a4 a5 b4 b5}"
        - "{c#5 c#6 b4 b5} {a4 a5 g#4 g#5}"
