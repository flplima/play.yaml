# J.S. Bach: Prelude and Fugue No. 12 in F minor, BWV 881 (The Well-Tempered Clavier, Book II, 1742)
# Public domain. Notes from Yo Tomita's sequence (prelude) and Kyle Rother's edition (fugue, IMSLP #497295).

title: "Prelude and Fugue No. 12 in F minor, BWV 881"
composer: "Johann Sebastian Bach"
tempo: 76
measure: 2/4
scale: f minor
dynamic: mezzopiano
articulation: legato

# One piano. In the prelude rh and lh are the hands; rh2 and lh2 hold what
# a hand keeps sounding while it moves on (a suspension, an inner voice),
# so each staff shows its own voices. The fugue keeps a track per voice.
