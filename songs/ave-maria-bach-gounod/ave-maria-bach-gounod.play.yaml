# Charles Gounod: Ave Maria (1853), a melody over J.S. Bach's Prelude BWV 846
# Public domain (Bach d. 1750, Gounod d. 1893). Melody transcribed from the 1856 Heugel edition, as typeset by the Mutopia Project (CC0).

title: "Ave Maria (Bach / Gounod)"
composer: "Johann Sebastian Bach / Charles Gounod"
tempo: 72
tempo text: Andante semplice
measure: 4/4

tracks:
  # Bach's prelude in 16ths (bass, tenor, broken chord); the pedal holds each bar
  piano:
    preset: epiano
    controls: { pedal: { cc: 64, range: [0, 24, 96, 118] } }   # short of 118: a floored damper rings into mud
    set: legato, pedale sincopato, dolce
    play:
      - 2x:   # Gounod plays Bach's first four bars alone, then again under the voice
          - "{c4 e4 g4 c5} {e5 g4 c5 e5} {c4 e4 g4 c5} {e5 g4 c5 e5}"   # 1, 5
          - "{c4 d4 a4 d5} {f5 a4 d5 f5} {c4 d4 a4 d5} {f5 a4 d5 f5}"
          - "{b3 d4 g4 d5} {f5 g4 d5 f5} {b3 d4 g4 d5} {f5 g4 d5 f5}"
          - "{c4 e4 g4 c5} {e5 g4 c5 e5} {c4 e4 g4 c5} {e5 g4 c5 e5}"
      - crescendo over 4
      - "{c4 e4 a4 e5} {a5 a4 e5 a5} {c4 e4 a4 e5} {a5 a4 e5 a5}"       # 9
      - "{c4 d4 f#4 a4} {d5 f#4 a4 d5} {c4 d4 f#4 a4} {d5 f#4 a4 d5}"
      - "{b3 d4 g4 d5} {g5 g4 d5 g5} {b3 d4 g4 d5} {g5 g4 d5 g5}"
      - "{b3 c4 e4 g4} {c5 e4 g4 c5} {b3 c4 e4 g4} {c5 e4 g4 c5}"
      - mezzoforte
      - "{a3 c4 e4 g4} {c5 e4 g4 c5} {a3 c4 e4 g4} {c5 e4 g4 c5}"       # 13
      - "{d3 a3 d4 f#4} {c5 d4 f#4 c5} {d3 a3 d4 f#4} {c5 d4 f#4 c5}"
      - "{g3 b3 d4 g4} {b4 d4 g4 b4} {g3 b3 d4 g4} {b4 d4 g4 b4}"
      - diminuendo over 3
      - "{g3 bb3 e4 g4} {c#5 e4 g4 c#5} {g3 bb3 e4 g4} {c#5 e4 g4 c#5}"
      - "{f3 a3 d4 a4} {d5 d4 a4 d5} {f3 a3 d4 a4} {d5 d4 a4 d5}"
      - "{f3 ab3 d4 f4} {b4 d4 f4 b4} {f3 ab3 d4 f4} {b4 d4 f4 b4}"
      - mezzopiano, cantabile, half pedal per bar
      - "{e3 g3 c4 g4} {c5 c4 g4 c5} {e3 g3 c4 g4} {c5 c4 g4 c5}"       # 19
      - "{e3 f3 a3 c4} {f4 a3 c4 f4} {e3 f3 a3 c4} {f4 a3 c4 f4}"
      - "{d3 f3 a3 c4} {f4 a3 c4 f4} {d3 f3 a3 c4} {f4 a3 c4 f4}"
      - "{g2 d3 g3 b3} {f4 g3 b3 f4} {g2 d3 g3 b3} {f4 g3 b3 f4}"
      - "{c3 e3 g3 c4} {e4 g3 c4 e4} {c3 e3 g3 c4} {e4 g3 c4 e4}"
      - crescendo over 5
      - "{c3 g3 bb3 c4} {e4 bb3 c4 e4} {c3 g3 bb3 c4} {e4 bb3 c4 e4}"   # 24
      - "{f2 f3 a3 c4} {e4 a3 c4 e4} {f2 f3 a3 c4} {e4 a3 c4 e4}"
      - "{f#2 c3 a3 c4} {eb4 a3 c4 eb4} {f#2 c3 a3 c4} {eb4 a3 c4 eb4}"
      - "{ab2 f3 b3 c4} {d4 b3 c4 d4} {ab2 f3 b3 c4} {d4 b3 c4 d4}"
      - "{g2 f3 g3 b3} {d4 g3 b3 d4} {g2 f3 g3 b3} {d4 g3 b3 d4}"
      - forte, sostenuto, pedale sincopato
      - "{g2 e3 g3 c4} {e4 g3 c4 e4} {g2 e3 g3 c4} {e4 g3 c4 e4}"       # 29
      - "{g2 d3 g3 c4} {f4 g3 c4 f4} {g2 d3 g3 c4} {f4 g3 c4 f4}"
      - "{g2 d3 g3 b3} {f4 g3 b3 f4} {g2 d3 g3 b3} {f4 g3 b3 f4}"
      - "{g2 eb3 a3 c4} {f#4 a3 c4 f#4} {g2 eb3 a3 c4} {f#4 a3 c4 f#4}"
      - "{g2 e3 g3 c4} {g4 g3 c4 g4} {g2 e3 g3 c4} {g4 g3 c4 g4}"
      - "{g2 d3 g3 c4} {f4 g3 c4 f4} {g2 d3 g3 c4} {f4 g3 c4 f4}"
      - "{g2 d3 g3 b3} {f4 g3 b3 f4} {g2 d3 g3 b3} {f4 g3 b3 f4}"
      - "{c2 c3 g3 bb3} {e4 g3 bb3 e4} {c2 c3 g3 bb3} {e4 g3 bb3 e4}"
      - fortissimo, ritardando over 2 to 54
      - "{c2 c3 f3 a3} {c4 f4 c4 a3} {c4 a3 f3 a3} {f3 d3 f3 d3}"       # 37
      - "{c2 b2 g4 b4} {d5 f5 d5 b4} {d5 b4 g4 b4} {d4 f4 e4 d4}"
      - piano, a tempo, senza pedale, pedal down   # hold the last chord under the fermata
      - "[c2 c3 e4 g4 c5] _ _ _"

  # Gounod's melody on a warm pad (GM 89), entering at bar 5. Dynamics ride on
  # expression (CC11) and vibrato on CC1, both ramped through the held notes.
  voice:
    preset: pad
    wait: 4
    dynamic: piano
    velocityRange: [114, 124]
    controls:
      expression: { cc: 11, range: [56, 127] }
      vibrato: 1
      vibrato_rate: 76
    set: legato, cantabile, vibrato 26, slow vibrato
    # The Latin prayer, one line per bar from bar 5. Underlay after a public-domain
    # 19th-century edition; bars 23-29 are fitted to Heugel's pickups.
    lyrics: |
      A-               # 5
      ve
      Ma- ri-
      a
      gra- _ ti- a     # 9
      ple- _ na
      Do- _ mi- nus
      te- _ cum
      be- _ ne- _      # 13
      dic- _ _ ta
      tu in
      mu- _ li- e-
      ri- bus          # 17
      et _ be- ne-
      dic- tus
      fruc- _ tus _
      ven- _ tris _    # 21
      tu- i Je- _
      sus, Sanc-
      _ ta Ma-
      ri- a, sanc-     # 25
      _ ta Ma-
      ri- a, Ma-
      ri- a, O- ra
      pro no- bis,
      no- bis pec- ca- # 30
      to- ri- bus,
      nunc _ et in
      ho- _ ra, in
      ho- _ _ ra
      mor- _ tis _ no- _ strae. _   # 35
      A-
      men.
    play:
      # the opening arch: four long notes, the tone warming from almost straight
      - vibrato to 58 over 3
      - "e5 _ _ _"                     # 5
      - "f5 _ _ _"
      - "g5 _ _ d5"
      - "e5 _ _ ~"

      # the sighing figure: a leap to a held note, an octave down, back up by step
      - crescendo over 1, vibrato to 78 over 2
      - "a5 _ {_ a4} {b4 c5}"          # 9
      - pianissimo
      - "d5 {_ _ _ e5} d5 ~"
      - crescendo over 1
      - "g5 _ {_ g4} {a4 b4}"
      - pianissimo
      - "c5 {_ _ _ d5} c5 ~"

      # the first high C, then the F# turn down to B
      - crescendo over 1, vibrato to 96 over 1
      - "c6 _ {_ c5} {d5 e5}"          # 13
      - diminuendo over 1
      - "f#5 {_ e5} d5 a4"
      - piano
      - "b4 _ {_ ~} d5"

      # the same rising sequence three times, a step higher each time
      - crescendo over 1, vibrato to 72 over 1
      - "e5 _ {_ e5} {f5 g5}"          # 16
      - pianissimo
      - "a5 _ a4 ~"
      - crescendo over 1
      - "d5 _ {_ d5} {e5 f5}"
      - pianissimo
      - "g5 _ g4 ~"
      - crescendo over 2
      - "c5 _ {_ c5} {d5 e5}"
      - "f5 _ {_ f5} {g5 a5}"

      # tops out on B5: the widest, fastest vibrato so far
      - forte, molto vibrato, fast vibrato
      - "b5 {_ a5} g5 d5"              # 22

      # the great crescendo molto: one half note per bar, a 16th pickup, the vibrato widening with it
      - piano, poco vibrato, slow vibrato
      - "e5 _ _ {~ ~ ~ e5}"            # 23
      - crescendo over 4, vibrato to 118 over 4, fast vibrato over 4
      - "g5 _ e5 {~ ~ ~ e5}"
      - "a5 _ a4 {~ ~ ~ a5}"
      - "a5 _ c5 {~ ~ ~ a5}"
      - "c6 _ d5 {~ ~ ~ d5}"

      # the release back to C, then a new rise from F
      - piano, vibrato to 92 over 1
      - "d5 _ {_ d5} {c5 b4}"          # 28
      - "g5 {_ e5} c5 ~"
      - crescendo over 1
      - "f5 _ {_ f5} {e5 d5}"

      # the climax: D6, then E6 (ff, "tutta forza"), the peak of the piece
      - forte, molto vibrato
      - "d6 {_ b5} g5 _"               # 31
      - "a5 _ {_ a5} {b5 c6}"
      - fortissimo, fast vibrato
      - "e6 _ {_ c6} {g5 e5}"
      - "d5 _ {_ a5} {b5 a5}"
      - "{a5 g5} {f5 d5} {b4 g4} {f4 d4}"   # 35: two octaves down through the G7

      # the voice lands low and holds C, then G, as the vibrato fades out
      - diminuendo over 2, poco vibrato over 2, slow vibrato over 2
      - "c4 _ _ _"                     # 36
      - "_ _ _ _"
      - pianissimo, senza vibrato
      - "g3 _ _ _"
      - "_ _ _ _"
