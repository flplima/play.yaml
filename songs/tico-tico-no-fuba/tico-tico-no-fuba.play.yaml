        - "a2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 d3"
        - "c#3 e2"
        - "a2 e2"
        - "a2 e2"
        - "f#2 c#3"
        - "b2 _"
