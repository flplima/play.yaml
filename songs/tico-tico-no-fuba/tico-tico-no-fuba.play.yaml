        - "e2 b2"
        - "e2 e2"
        - "a2 c3"
        - "d3 _"
        - "e2 _"
        - "{~ b2 _ _} ~"
        - "e2 e2"
        - "a2 c3"
        - "e2 b2"
        - "e2 _"
        - "c3 c3"
        - "{f2 _ _ d3} _"
        - "{e2 _ _ e3} _"
        - "e2 _"
        - "{a2 e2} a2"

  trio_c1:
