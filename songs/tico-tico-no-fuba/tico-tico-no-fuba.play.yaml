        - "{d4 c#4 d4 _} ~"
        - "~ ~"
        - "~ ~"
        - "{a3 e3} {~ a3 c#4 e4}"
    cello:
      play:
        - "a2 e2"
        - "a2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 e2"
        - "b2 d3"
        - "c#3 e2"
        - "a2 e2"
        - "a2 e2"
        - "f#2 c#3"
        - "b2 _"
        - "d3 e2"
        - "a2 _"
        - "e2 _"
        - "a2 a2"

  trio_c2:
    loop: false
    flute:
      # Repeat of the A-major Trio; bar 68 pivots back to A minor via {~ e4 d#4 e4}.
      play:
        - "{a4 _ _ g#4} {_ _ _ f#4}"
        - "{f#4 _ _ e4} {_ _ c#4 f#4}"
        - "{f#4 _ _ e4} {_ _ c#4 f#4}"
        - "{f#4 ~ ~ ~} {~ ~ ~ f#4}"
        - "{a4 _ _ g#4} {~ ~ ~ ~}"
        - "f#4 {~ ~ ~ f#4}"
        - "{a4 _ _ g#4} {~ ~ ~ ~}"
        - "f#4 ~"
        - "{a4 _ _ g#4} {_ _ _ f#4}"
