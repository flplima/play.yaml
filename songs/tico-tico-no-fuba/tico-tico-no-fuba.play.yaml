        - "{~ a3 c#4 e4} {_ a3 c#4 e4}"
        - "{~ a3 c#4 _} {~ a3 c#4 _}"
        - "{~ a3 c#4 _} {~ a3 _ _}"
        - "{~ ~ ~ a#3} {~ ~ c#4 a#3}"
