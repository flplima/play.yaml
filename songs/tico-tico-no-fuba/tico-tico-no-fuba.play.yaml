    clarinet:
      play:
        - "{~ a3 c#4 _} {~ a3 c#4 _}"
        - "{~ a3 c#4 _} {~ a3 _ _}"
        - "{~ a3 c#4 _} {~ a3 _ _}"
        - "{~ b3 d4 e4} {_ d4 e4 _}"
        - "{~ b3 d4 _} {~ d4 e4 f#4}"
        - "{~ b3 d4 e4} {_ d4 e4 _}"
        - "{~ b3 d4 _} {~ d4 e4 f#4}"
        - "{~ a3 c#4 e4} {_ a3 c#4 e4}"
        - "{~ a3 c#4 _} {~ a3 c#4 _}"
        - "{~ a3 c#4 _} {~ a3 _ _}"
        - "{~ ~ ~ a#3} {~ ~ c#4 a#3}"
        - "{b3 a#3 b3 c#4} d4"
        - "{d4 c#4 d4 _} ~"
        - "~ ~"
        - "~ ~"
        - "a3 ~"
    cello:
