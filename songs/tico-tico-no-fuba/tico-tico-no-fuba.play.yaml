# Zequinha de Abreu: "Tico-Tico no Fuba" (1917)
# Public domain. Transcribed from Eugene Kirpichov's guitar engraving MIDI, cross-checked against IMSLP #211430.

title: "Tico-Tico no Fuba"
composer: "Zequinha de Abreu"
key: { 1: a minor, 37: a major, 69: a minor }   # the trio is in A major
tempo: 100
measure: 2/4
scale: a minor

tracks:
  flute: { sample: flute, velocity: 92 }
  clarinet: { sample: clarinet, velocity: 82 }
  cello: { sample: cello, velocity: 84 }

sections:
  intro:
    loop: false
    flute:
      # Descending A-minor run answered by rising chromatic sixths on beat 2,
      # landing on the E7 dominant chord and the signature {e4 d#4 e4} pickup.
      play:
        - "{e5 d5 _ c5} {b4 a4}"
        - "{g#4 b4} {c5 d5}"
        - "e5 ~"
        - "[e4 g#4 e5] {~ e4 d#4 e4}"
    clarinet:
      play:
        - "~ ~"
        - "{~ g3} {f#3 f3}"
        - "~ ~"
        - "~ ~"
    cello:
      play:
        - "~ ~"
        - "~ ~"
        - "e3 ~"
        - "e2 ~"

  part_a1:
    loop: false
    flute:
      # Bars 5-12: the iconic syncopated sixteenth-note melody in A minor.
      # Bars 13-15: offbeat upper chord stabs answering the clarinet's low line.
      play:
        - "{f4 e4 _ a4} {~ e4 d#4 e4}"
        - "{f4 e4 _ g#4} {~ e4 d#4 e4}"
        - "{f4 e4 d5 b4} {g#4 e4 d4 c#4}"
        - "c4 {~ a4 g#4 g4}"
        - "{f4 a4 d5 _} {_ c5 _ _}"
        - "{e4 a4 c5 _} {_ c5 b4 a#4}"
        - "{b4 ~ ~ ~} {~ ~ b4 a4}"
        - "{g#4 e5 _ [e4 g#4 e5]} ~"
        - "{~ ~ ~ [a3 c4 e4]} ~"
        - "{~ ~ ~ [g#3 d4 e4]} ~"
        - "{~ ~ d4 b3} ~"
        - "~ ~"
        - "~ ~"
        - "~ ~"
        - "~ ~"
        - "~ {[c4 e4 a4] e4 d#4 e4}"
    clarinet:
      # Bars 5-11: syncopated choro accompaniment and B7 arpeggio climb.
      # Bars 12-20: takes over the main theme in the warm chalumeau register.
      play:
        - "{~ ~ ~ [c4 e4]} ~"
        - "{~ ~ ~ [d4 e4]} ~"
        - "{[g#3 b3] ~ ~ ~} ~"
        - "{~ [e3 a3] _ [e3 a3]} ~"
        - "{f4 _ _ f4} {a4 _ a4 f4}"
        - "{e4 _ _ e4} {a4 ~ ~ ~}"
        - "{~ ~ f#3 b3} {d#4 f4 _ _}"
        - "e4 {~ e3 d#3 e3}"
        - "{f3 e3 _ _} {~ e3 d#3 e3}"
        - "{f3 e3 _ _} {~ e3 d#3 e3}"
        - "{[f3 g#3] e3 _ _} {g3 e3 d3 c#3}"
        - "{c3 [e3 a3] _ [e3 a3]} {~ a3 g#3 g3}"
        - "{f3 a3 d4 _} {[a3 d4] c4 b3 a3}"
        - "{e3 a3 c4 _} {[a3 c4] c4 b3 a#3}"
        - "{b3 e3 g#3 b3} {e4 d4 c4 b3}"
        - "a3 ~"
    cello:
      # Two-beat choro bass (Am -> E7 -> Am -> Dm -> Am/E -> B7 -> E7 -> Am).
      play:
        - "a2 c3"
        - "e2 b2"
        - "e2 e2"
        - "a2 c3"
        - "d3 _"
        - "e2 _"
        - "{~ b2 _ _} ~"
        - "e2 e2"
        - "a2 c3"
        - "e2 b2"
        - "e2 _"
        - "c3 c3"
        - "{f2 _ _ d3} _"
        - "{e2 _ _ e3} _"
        - "e2 _"
        - "{a2 e2} a2"

  part_a2:
