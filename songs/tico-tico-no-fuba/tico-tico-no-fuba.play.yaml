    flute:
      # Final da capo restatement of Part A, closing on the Picardy A-major chord.
      play:
        - "{f4 e4 _ a4} {~ e4 d#4 e4}"
        - "{f4 e4 _ g#4} {~ e4 d#4 e4}"
        - "{f4 e4 d5 b4} {g#4 e4 d4 c#4}"
        - "c4 {~ a4 g#4 g4}"
        - "{f4 a4 d5 _} {_ c5 _ _}"
