        - "{bb4 _ a4 g4} bb4 {a4 bb4 a4 g4}"
        - "_ {_ f4 e4 d4} e4"
        - "_ {~ bb4} {c5 db5}"
        - "{_ db5} {_ db5} {db5 db5}"
        - "{db5 db5 db5} {db5 _ c5 bb4} {db5 _ c5 bb4}"
        - "{db5 c5 bb4 ab4} {g4 f4 e4 _} _"
        - "_ _ {_ ~}"
        - "d4 {_ e4} {d4 e4 f4 _}"
        - "_ {g4 ab4} {f4 g4 e4}"
        - "{d4 e4 d4 c4} {_ bb3} _"
        - "{_ c4 bb3 c4} {d4 e4 d4 c4} {d4 c4 bb3 ab3}"
        - "{bb3 ab3 g3 _} {_ f3} _"
        - "_ {_ g3 f3 eb3} _"
        - "_ {f3 eb3 f3 db3} _"
        - "_ {_ db3 eb3 db3} {f3 eb3 db3 c3}"

  # bars 129-146: theme B, sopranino then soprano saxophone (both on the clarinet here)
  r7-soprano-saxes:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violins-1:
      play:
        - "mezzopiano"
        - 10x: "~ [c4 d4 e4 d5 e5] [bb3 c4 d4 bb4 d5]"
        - 2x: "~ [c4 d4 f4 d5 f5] [b3 c4 d4 b4 d5]"
