# Maurice Ravel: Boléro (1928), reduced orchestration
# Public domain: Ravel died in 1937 and the Benois heirs' co-author claim was
# rejected in 2024, so the work is free in France since 2016; it was published
# in 1929, so it is free in the US since 2025.
#
# Source: the Durand full score (plate D. & F. 11 839, engraved 1929), read
# through Nicolas Sceaux's CC0 LilyPond edition of it (github.com/nsceaux/Ravel_Bolero)
# and checked by eye against a scan of the Durand plates. Every note below is one
# of Ravel's, at concert pitch. The reduction keeps the snare drum, the harp, the
# whole string section and, in each section, the instruments that carry the
# theme or the rhythm figure; it drops the wind and brass doublings. See README.md.
#
# Form: 340 bars of 3/4 at quarter = 72. A 4-bar opening, then theme A (16 bars)
# and theme B (16 bars) passed from instrument to instrument, two of each in
# turn: 18 statements in all, one per rehearsal number, each over the same
# two-bar ostinato. At 18 the music turns to E major for 8 bars, back to C, and
# collapses.

title: "Boléro"
composer: "Maurice Ravel"
key: c major
tempo: 72
tempo text: Tempo di Bolero, moderato assai
measure: 3/4

# A track ending in -2 holds a second line of the same instrument: a divisi,
# a second player, or a held note under a moving one.
tracks:
  snare: { kit: acoustic }
  snare-2: { kit: acoustic }
  harp: { preset: harp, channel: 5 }
  violins-1: { preset: violins, channel: 1, controls: { playmode: 20 } }
  violins-1-2: { preset: violins, channel: 1, controls: { playmode: 20 } }
  violins-2: { preset: violins, channel: 1, controls: { playmode: 20 } }
  violins-2-2: { preset: violins, channel: 1, controls: { playmode: 20 } }
  violas: { preset: violas, channel: 2, controls: { playmode: 20 } }
  violas-2: { preset: violas, channel: 2, controls: { playmode: 20 } }
  cellos: { preset: cellos, channel: 3, controls: { playmode: 20 } }
  cellos-2: { preset: cellos, channel: 3, controls: { playmode: 20 } }
  basses: { preset: basses, channel: 4, controls: { playmode: 20 } }
  flute: { preset: flute, channel: 6 }
  clarinet: { preset: clarinet, channel: 11 }
  clarinet-2: { preset: clarinet, channel: 11 }
  bassoon: { preset: bassoon, channel: 12 }
  bassoon-2: { preset: bassoon, channel: 12 }
  oboe: { preset: oboe, channel: 8 }
  oboe-2: { preset: oboe, channel: 8 }
  english-horn: { preset: english-horn, channel: 9 }
  trumpet: { preset: trumpet, channel: 13 }
  trumpet-2: { preset: trumpet, channel: 13 }
  horn: { preset: horn, channel: 14 }
  horn-2: { preset: horn, channel: 14 }
  tenor-sax: { preset: bass-clarinet, channel: 11 }
  soprano-sax: { preset: clarinet, channel: 11 }
  celesta: { preset: celesta, channel: 16 }
  piccolo: { preset: piccolo, channel: 7 }
  trombone: { preset: trombone, channel: 15 }
  trombone-2: { preset: trombone, channel: 15 }
  percussion: { kit: acoustic }
  percussion-2: { kit: acoustic }

sections:
  # bars 1-20: snare and pizzicato alone, then theme A on the flute (bar 5)
  opening:
    loop: false
    snare:
      play:
        - "pianissimo"
        - 10x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violas:
      play:
        - "pianissimo, pizzicato"
        - 20x: "g3 [g3 g4] ~"
    cellos:
      play:
        - "pianissimo, pizzicato"
        - 10x: ["c3 ~ [g2 g3]", "c3 ~ {[g2 g3] g3}"]
    flute:
      wait: 4
      play:
        - "pianissimo"
        - "c5 {_ _ b4 c5} {d5 c5 b4 a4}"
        - "{c5 _ c5 a4} c5 {_ _ b4 c5}"
        - "{a4 g4 e4 f4} g4 _"
        - "{_ f4 e4 d4} {e4 f4 g4 a4} g4"
        - "_ {_ a4 b4 a4} {g4 f4 e4 d4}"
        - "{e4 d4 c4 _} {_ _ c4 d4} {e4 f4}"
        - "d4 g4 _"
        - "_ _ {_ ~}"
        - "d5 {_ _ _ c5} {b4 a4 b4 c5}"
        - "{d5 c5 b4 _} {_ c5 b4 a4} {c5 b4 a4 f4}"
        - "{_ _ f4 f4} {f4 a4} {c5 a4 b4 g4}"
        - "{f4 _ f4 f4} {f4 a4} {b4 g4 a4 f4}"
        - "{d4 _ d4 c4} d4 {_ _ d4 d4}"
        - "{d4 f4} {a4 f4 g4 e4} {d4 _ d4 c4}"
        - "d4 {_ _ d4 c4} {d4 _ e4 f4}"
        - "g4 _ {_ f4 e4 d4}"

  # bars 21-38: theme A, clarinet; the second flute takes up the snare rhythm on G
  r1-clarinet:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violas:
      play:
        - 18x: "[c3 g3] [g3 g4] c3"
    cellos:
      play:
        - 9x: ["c3 ~ [g2 g3]", "c3 ~ {[g2 g3] g3}"]
    flute:
      play:
        - "{~ {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
        - 8x: ["{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}", "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"]
        - "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}"
    clarinet:
      wait: 2
      play:
        - "piano"
        - "c5 {_ _ b4 c5} {d5 c5 b4 a4}"
        - "{c5 _ c5 a4} c5 {_ _ b4 c5}"
        - "{a4 g4 e4 f4} g4 _"
        - "{_ f4 e4 d4} {e4 f4 g4 a4} g4"
        - "_ {_ a4 b4 a4} {g4 f4 e4 d4}"
        - "{e4 d4 c4 _} {_ _ c4 d4} {e4 f4}"
        - "d4 g4 _"
        - "_ _ {_ ~}"
        - "d5 {_ _ _ c5} {b4 a4 b4 c5}"
        - "{d5 c5 b4 _} {_ c5 b4 a4} {c5 b4 a4 f4}"
        - "{_ _ f4 f4} {f4 a4} {c5 a4 b4 g4}"
        - "{f4 _ f4 f4} {f4 a4} {b4 g4 a4 f4}"
        - "{d4 _ d4 c4} d4 {_ _ d4 d4}"
        - "{d4 f4} {a4 f4 g4 e4} {d4 _ d4 c4}"
        - "d4 {_ _ d4 c4} {d4 _ e4 f4}"
        - "g4 _ {_ f4 e4 d4}"

  # bars 39-56: theme B, bassoon high in its range; the harp comes in
  r2-bassoon:
    loop: false
    snare:
      play:
        - "piano"
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    harp:
      play:
        - "piano"
        - 10x: "~ [d3 e3] [c3 d3]"
        - 2x: "~ [c3 d3] [b2 c3]"
        - 3x: "~ [d3 e3] [c3 d3]"
        - "~ [c3 d3] [bb2 c3]"
        - "~ [bb2 c3] [ab2 c3]"
        - "~ [ab2 c3] [g2 c3]"
    violas:
      play:
        - "piano"
        - 18x: "[c3 g3] [g3 g4] c3"
    cellos:
      play:
        - "piano"
        - 9x: ["c3 ~ [g2 g3]", "c3 ~ {[g2 g3] g3}"]
    flute:
      play:
        - "piano"
        - "{~ {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
        - 8x: ["{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}", "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"]
        - "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}"
    bassoon:
      wait: 2
      play:
        - "mezzopiano"
        - "bb4 {_ a4 g4 f4} {bb4 c5 a4 g4}"
        - "{bb4 _ a4 g4} bb4 {a4 bb4 a4 g4}"
        - "_ {_ f4 e4 d4} e4"
        - "_ {~ bb4} {c5 db5}"
        - "{_ db5} {_ db5} {db5 db5}"
        - "{db5 db5 db5} {db5 _ c5 bb4} {db5 _ c5 bb4}"
        - "{db5 c5 bb4 ab4} {g4 f4 e4 _} _"
        - "_ _ {_ ~}"
        - "d4 {_ e4} {d4 e4 f4 _}"
        - "_ {g4 ab4} {f4 g4 e4}"
        - "{d4 e4 d4 c4} {_ bb3} _"
        - "{_ c4 bb3 c4} {d4 e4 d4 c4} {d4 c4 bb3 ab3}"
        - "{bb3 ab3 g3 _} {_ f3} _"
        - "_ {_ g3 f3 eb3} _"
        - "_ {f3 eb3 f3 db3} _"
        - "_ {_ db3 eb3 db3} {f3 eb3 db3 c3}"

  # bars 57-74: theme B, E-flat clarinet (on the clarinet here), an octave up
  r3-eb-clarinet:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    harp:
      play:
        - "mezzopiano"
        - 10x: "~ [c4 d4 e4] [bb3 c4 d4]"
        - 2x: "~ [c4 d4 f4] [b3 c4 d4]"
        - 2x: "~ [c4 d4 e4] [bb3 c4 d4]"
        - "~ [c4 d4 e4] [ab3 c4 d4]"
        - "~ [ab3 c4 d4] [g3 bb3 c4]"
        - "~ [g3 bb3 c4] [g3 ab3 c4]"
        - "~ [g3 ab3 c4] [g3 c4]"
    violas:
      play:
        - 18x: "[c3 g3] [g3 g4] [c3 g3]"
    cellos:
      play:
        - 9x: ["[c2 c3] ~ [g2 g3]", "[c2 c3] ~ {[g2 g3] g3}"]
    flute:
      play:
        - "{~ {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
        - 8x: ["{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}", "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"]
        - "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}"
    clarinet:
      wait: 2
      play:
        - "bb5 {_ a5 g5 f5} {bb5 c6 a5 g5}"
        - "{bb5 _ a5 g5} bb5 {a5 bb5 a5 g5}"
        - "_ {_ f5 e5 d5} e5"
        - "_ {~ bb5} {c6 db6}"
        - "{_ db6} {_ db6} {db6 db6}"
        - "{db6 db6 db6} {db6 _ c6 bb5} {db6 _ c6 bb5}"
        - "{db6 c6 bb5 ab5} {g5 f5 e5 _} _"
        - "_ _ {_ ~}"
        - "d5 {_ e5} {d5 e5 f5 _}"
        - "_ {g5 ab5} {f5 g5 e5}"
        - "{d5 e5 d5 c5} {_ bb4} _"
        - "{_ c5 bb4 c5} {d5 e5 d5 c5} {d5 c5 bb4 ab4}"
        - "{bb4 ab4 g4 _} {_ f4} _"
        - "_ {_ g4 f4 eb4} _"
        - "_ {f4 eb4 f4 db4} _"
        - "_ {_ db4 eb4 db4} {f4 eb4 db4 c4}"
    bassoon:
      play:
        - "_ ~ ~"

  # bars 75-92: theme A, oboe d'amore (on the oboe here); the bassoons take the rhythm
  r4-oboe-d-amore:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violins-2:
      play:
        - "piano, pizzicato"
        - 7x: "~ [g3 d4 e4 g4] [g3 b3 d4 g4]"
        - "~ [g3 d4 e4 g4] [g3 b3 e4 g4]"
        - 9x: "~ [g3 d4 f4 g4] [g3 b3 d4 g4]"
        - "~ [g3 c4 e4 g4] [g3 c4 d4 g4]"
    violas:
      play:
        - 18x: "[c3 g3] c4 [c3 c4]"
    cellos:
      play:
        - 4x: ["[c2 g2 e3] ~ [g2 g3]", "[c2 g2 e3] ~ {[g2 g3] g3}"]
        - 4x: ["[c2 g2 d3] ~ [g2 g3]", "[c2 g2 d3] ~ {[g2 g3] g3}"]
        - "[c2 g2 d3] ~ [g2 g3]"
        - "[c2 g2 e3] ~ {[g2 g3] g3}"
    basses:
      play:
        - "piano, pizzicato"
        - 18x: "c2 ~ g2"
    clarinet:
      play:
        - "_ ~ ~"
    bassoon:
      play:
        - "{~ {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
        - 17x: "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
    bassoon-2:
      wait: 1
      play:
        - "mezzopiano"
        - 8x: ["~ ~ {~ g4 g4 ~ g4 g4}", "~"]
        - "~ ~ {~ g4 g4 ~ g4 g4}"
    oboe:
      wait: 2
      play:
        - "mezzopiano"
        - "c5 {_ _ b4 c5} {d5 c5 b4 a4}"
        - "{c5 _ c5 a4} c5 {_ _ b4 c5}"
        - "{a4 g4 e4 f4} g4 _"
        - "{_ f4 e4 d4} {e4 f4 g4 a4} g4"
        - "_ {_ a4 b4 a4} {g4 f4 e4 d4}"
        - "{e4 d4 c4 _} {_ _ c4 d4} {e4 f4}"
        - "d4 g4 _"
        - "_ _ {_ ~}"
        - "d5 {_ _ _ c5} {b4 a4 b4 c5}"
        - "{d5 c5 b4 _} {_ c5 b4 a4} {c5 b4 a4 f4}"
        - "{_ _ f4 f4} {f4 a4} {c5 a4 b4 g4}"
        - "{f4 _ f4 f4} {f4 a4} {b4 g4 a4 f4}"
        - "{d4 _ d4 c4} d4 {_ _ d4 d4}"
        - "{d4 f4} {a4 f4 g4 e4} {d4 _ d4 c4}"
        - "d4 {_ _ d4 c4} {d4 _ e4 f4}"
        - "g4 _ {_ f4 e4 d4}"

  # bars 93-110: theme A, flute and muted trumpet an octave apart
  r5-flute-and-trumpet:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violins-1:
      play:
        - "piano, pizzicato"
        - 7x: "~ [c4 d4 e4 d5 e5] [b3 c4 d4 b4 d5]"
        - "~ [c4 d4 e4 d5 e5] [b3 c4 e4 b4 e5]"
        - 9x: "~ [c4 d4 f4 d5 f5] [b3 c4 d4 b4 d5]"
        - "~ [c4 d4 e4 d5 e5] [g3 c4 d4 c5 d5]"
    violas:
      play:
        - 18x: "[c3 g3] [g3 g4 c5] [c3 g3 g4 c5]"
    cellos:
      play:
        - 4x: ["[c2 g2 e3] ~ [g2 g3]", "[c2 g2 e3] ~ {[g2 g3] g3}"]
        - 4x: ["[c2 g2 d3] ~ [g2 g3]", "[c2 g2 d3] ~ {[g2 g3] g3}"]
        - "[c2 g2 d3] ~ [g2 g3]"
        - "[c2 g2 e3] ~ {[g2 g3] g3}"
    basses:
      play:
        - 18x: "c2 ~ g2"
    flute:
      wait: 2
      play:
        - "pianissimo"
        - "c6 {_ _ b5 c6} {d6 c6 b5 a5}"
        - "{c6 _ c6 a5} c6 {_ _ b5 c6}"
        - "{a5 g5 e5 f5} g5 _"
        - "{_ f5 e5 d5} {e5 f5 g5 a5} g5"
        - "_ {_ a5 b5 a5} {g5 f5 e5 d5}"
        - "{e5 d5 c5 _} {_ _ c5 d5} {e5 f5}"
        - "d5 g5 _"
        - "_ _ {_ ~}"
        - "d6 {_ _ _ c6} {b5 a5 b5 c6}"
        - "{d6 c6 b5 _} {_ c6 b5 a5} {c6 b5 a5 f5}"
        - "{_ _ f5 f5} {f5 a5} {c6 a5 b5 g5}"
        - "{f5 _ f5 f5} {f5 a5} {b5 g5 a5 f5}"
        - "{d5 _ d5 c5} d5 {_ _ d5 d5}"
        - "{d5 f5} {a5 f5 g5 e5} {d5 _ d5 c5}"
        - "d5 {_ _ d5 c5} {d5 _ e5 f5}"
        - "g5 _ {_ f5 e5 d5}"
    trumpet:
      wait: 2
      play:
        - "mezzopiano"
        - "c5 {_ _ b4 c5} {d5 c5 b4 a4}"
        - "{c5 _ c5 a4} c5 {_ _ b4 c5}"
        - "{a4 g4 e4 f4} g4 _"
        - "{_ f4 e4 d4} {e4 f4 g4 a4} g4"
        - "_ {_ a4 b4 a4} {g4 f4 e4 d4}"
        - "{e4 d4 c4 _} {_ _ c4 d4} {e4 f4}"
        - "d4 g4 _"
        - "_ _ {_ ~}"
        - "d5 {_ _ _ c5} {b4 a4 b4 c5}"
        - "{d5 c5 b4 _} {_ c5 b4 a4} {c5 b4 a4 f4}"
        - "{_ _ f4 f4} {f4 a4} {c5 a4 b4 g4}"
        - "{f4 _ f4 f4} {f4 a4} {b4 g4 a4 f4}"
        - "{d4 _ d4 c4} d4 {_ _ d4 d4}"
        - "{d4 f4} {a4 f4 g4 e4} {d4 _ d4 c4}"
        - "d4 {_ _ d4 c4} {d4 _ e4 f4}"
        - "g4 _ {_ f4 e4 d4}"
    horn:
      play:
        - "piano"
        - "{~ {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"
        - 8x: ["{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}", "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"]
        - "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}"

  # bars 111-128: theme B, tenor saxophone (on the bass clarinet here)
  r6-tenor-sax:
    loop: false
    snare:
      play:
        - 9x: ["{sd {sd sd sd}} {sd {sd sd sd}} {sd sd}", "{sd {sd sd sd}} {sd {sd sd sd}} {sd sd sd sd sd sd}"]
    violins-2:
      play:
        - "mezzopiano"
        - 2x: "~ [c4 e4] [b3 d4]"
        - 8x: "~ [c4 e4] [bb3 d4]"
        - 2x: "~ [c4 f4] [b3 d4]"
        - 2x: "~ [c4 e4] [bb3 d4]"
        - "~ [c4 e4] [ab3 d4]"
        - "~ [ab3 d4] c4"
        - 2x: "~ c4 c4"
    violas:
      play:
        - "mezzopiano"
        - 15x: "[c3 g3] [g3 d4] [c3 c4]"
        - "[c3 g3] c4 [c3 bb3]"
        - "[c3 g3] bb3 [c3 ab3]"
        - "[c3 g3] ab3 [c3 g3]"
    cellos:
      play:
        - "mezzopiano"
        - 5x: ["[c2 g2 e3] ~ [g2 g3]", "[c2 g2 e3] ~ {[g2 g3] g3}"]
        - "[c2 g2 d3] ~ [g2 g3]"
        - "[c2 g2 d3] ~ {[g2 g3] g3}"
        - "[c2 g2 e3] ~ [g2 g3]"
        - "[c2 g2 e3] ~ {[g2 g3] g3}"
        - "[c2 g2 e3] ~ [g2 g3]"
        - "[c2 g2 d3] g3 {[g2 g3] g3}"
        - "[c2 g2 g3] g3 [g2 g3]"
        - "[c2 g2 g3] g3 {[g2 g3] g3}"
    basses:
      play:
        - "mezzopiano"
        - 18x: "c2 ~ g1"
    flute:
      play:
        - "piano"
        - "{c5 ~} {[c4 e4] ~} {[c4 d4] ~}"
        - 9x: "~ {[c4 e4] ~} {[c4 d4] ~}"
        - 2x: "~ {[c4 f4] ~} {[c4 d4] ~}"
        - 2x: "~ {[c4 e4] ~} {[c4 d4] ~}"
        - "~ {e4 ~} {d4 ~}"
        - "~ {d4 ~} {c4 ~}"
