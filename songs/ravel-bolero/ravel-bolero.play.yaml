        - 8x: ["{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}", "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4}"]
        - "{g4 {g4 g4 g4}} {g4 {g4 g4 g4}} {g4 g4 g4 g4 g4 g4}"
