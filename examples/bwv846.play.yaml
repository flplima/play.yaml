# J.S. Bach: Prelude No. 1 in C major, BWV 846 (The Well-Tempered Clavier, Book I, 1722)
# Public domain (Bach d. 1750).

title: "Prelude in C major, BWV 846"
composer: "Johann Sebastian Bach"
tempo: 72
measure: 4/4

# Bach's texture on two staves: the right hand's broken chord over the left
# hand's two lines, a tenor tied across each half bar and a bass held under
# it. All three are one piano; the tenor and bass share the lower staff.
tracks:
  rh:
    preset: epiano
    dynamic: mezzopiano
    controls:
      # cc, and how far the pedal words may push it; the curve stops short of 118 (a floored damper rings into mud)
      pedal: { cc: 64, range: [0, 24, 96, 118] }
      soft: { cc: 67, range: 90 }
    # Syncopated pedalling: the pedal lifts on each new bass note and retakes at once
    set: legato, pedale sincopato
  tenor:
    preset: epiano
    dynamic: mezzopiano
    controls:
      pedal: { cc: 64, range: [0, 24, 96, 118] }
      soft: { cc: 67, range: 90 }
    set: legato, pedale sincopato
  bass:
    preset: epiano
    dynamic: mezzopiano
    controls:
      pedal: { cc: 64, range: [0, 24, 96, 118] }
      soft: { cc: 67, range: 90 }
    set: legato, pedale sincopato

sections:
  piece:
    loop: false
    rh:
      play:
        # --- Opening Statement (Bars 1-4): C major, gentle dolce flow ---
        - "dolce"
        - "{~ ~ g4 c5} {e5 g4 c5 e5} {~ ~ g4 c5} {e5 g4 c5 e5}"
        - "{~ ~ a4 d5} {f5 a4 d5 f5} {~ ~ a4 d5} {f5 a4 d5 f5}"
        - "{~ ~ g4 d5} {f5 g4 d5 f5} {~ ~ g4 d5} {f5 g4 d5 f5}"
        - "{~ ~ g4 c5} {e5 g4 c5 e5} {~ ~ g4 c5} {e5 g4 c5 e5}"

        # --- Harmonic Rise (Bars 5-8): Crescendo toward A minor ---
        - "crescendo over 4"
        - "{~ ~ a4 e5} {a5 a4 e5 a5} {~ ~ a4 e5} {a5 a4 e5 a5}"
        - "{~ ~ f#4 a4} {d5 f#4 a4 d5} {~ ~ f#4 a4} {d5 f#4 a4 d5}"
        - "{~ ~ g4 d5} {g5 g4 d5 g5} {~ ~ g4 d5} {g5 g4 d5 g5}"
        - "{~ ~ e4 g4} {c5 e4 g4 c5} {~ ~ e4 g4} {c5 e4 g4 c5}"

        # --- Middle Arc (Bars 9-14): D minor / F minor darkening ---
        - "mezzoforte"
        - "{~ ~ e4 g4} {c5 e4 g4 c5} {~ ~ e4 g4} {c5 e4 g4 c5}"
        - "{~ ~ d4 f#4} {c5 d4 f#4 c5} {~ ~ d4 f#4} {c5 d4 f#4 c5}"
        - "{~ ~ d4 g4} {b4 d4 g4 b4} {~ ~ d4 g4} {b4 d4 g4 b4}"
        - "diminuendo over 3"
        - "{~ ~ e4 g4} {c#5 e4 g4 c#5} {~ ~ e4 g4} {c#5 e4 g4 c#5}"
        - "{~ ~ d4 a4} {d5 d4 a4 d5} {~ ~ d4 a4} {d5 d4 a4 d5}"
        - "{~ ~ d4 f4} {b4 d4 f4 b4} {~ ~ d4 f4} {b4 d4 f4 b4}"

        # --- Floating Middle (Bars 15-19): Subdued & cantabile ---
        - "mezzopiano"
        - "cantabile"
        # Half the depth, still re-taken each bar: the texture stays legato
        # without the wash the full pedal gives it.
        - "half pedal per bar"
        - "{~ ~ c4 g4} {c5 c4 g4 c5} {~ ~ c4 g4} {c5 c4 g4 c5}"
        - "{~ ~ a3 c4} {f4 a3 c4 f4} {~ ~ a3 c4} {f4 a3 c4 f4}"
        - "{~ ~ a3 c4} {f4 a3 c4 f4} {~ ~ a3 c4} {f4 a3 c4 f4}"
        - "{~ ~ g3 b3} {f4 g3 b3 f4} {~ ~ g3 b3} {f4 g3 b3 f4}"
        - "{~ ~ g3 c4} {e4 g3 c4 e4} {~ ~ g3 c4} {e4 g3 c4 e4}"

        # --- Chromatic Bass Line (Bars 20-24): Building tension over pedal ---
        - "crescendo over 5"
        - "{~ ~ bb3 c4} {e4 bb3 c4 e4} {~ ~ bb3 c4} {e4 bb3 c4 e4}"
        - "{~ ~ a3 c4} {e4 a3 c4 e4} {~ ~ a3 c4} {e4 a3 c4 e4}"
        - "{~ ~ a3 c4} {eb4 a3 c4 eb4} {~ ~ a3 c4} {eb4 a3 c4 eb4}"
        - "{~ ~ b3 c4} {d4 b3 c4 d4} {~ ~ b3 c4} {d4 b3 c4 d4}"
        - "{~ ~ g3 b3} {d4 g3 b3 d4} {~ ~ g3 b3} {d4 g3 b3 d4}"

        # --- Dominant Pedal Climax (Bars 25-32): Forte & sostenuto ---
        - "forte"
        - "sostenuto"
        - "pedale sincopato"
        - "{~ ~ g3 c4} {e4 g3 c4 e4} {~ ~ g3 c4} {e4 g3 c4 e4}"
        - "{~ ~ g3 c4} {f4 g3 c4 f4} {~ ~ g3 c4} {f4 g3 c4 f4}"
        - "{~ ~ g3 b3} {f4 g3 b3 f4} {~ ~ g3 b3} {f4 g3 b3 f4}"
        - "{~ ~ a3 c4} {f#4 a3 c4 f#4} {~ ~ a3 c4} {f#4 a3 c4 f#4}"
        - "{~ ~ g3 c4} {g4 g3 c4 g4} {~ ~ g3 c4} {g4 g3 c4 g4}"
        - "{~ ~ g3 c4} {f4 g3 c4 f4} {~ ~ g3 c4} {f4 g3 c4 f4}"
        - "{~ ~ g3 b3} {f4 g3 b3 f4} {~ ~ g3 b3} {f4 g3 b3 f4}"
        - "{~ ~ g3 bb3} {e4 g3 bb3 e4} {~ ~ g3 bb3} {e4 g3 bb3 e4}"

        # --- Cadenza & Grand Resolution (Bars 33-35) ---
        - "fortissimo"
        - "ritardando over 2 to 54"
        # The tenor doubles the C pedal an octave up on the second sixteenth of these two bars
        - "{~ ~ f3 a3} {c4 f4 c4 a3} {c4 a3 f3 a3} {f3 d3 f3 d3}"
        - "{~ ~ g4 b4} {d5 f5 d5 b4} {d5 b4 g4 b4} {d4 f4 e4 d4}"
        - "piano"
        - "a tempo"
        # Stop re-taking and hold the last chord under the fermata.
        - "senza pedale"
        - "pedal down"
        - "[e4 g4 c5] _ _ _"
