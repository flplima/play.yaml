        - "{c2 c3 g3 bb3} {e4 g3 bb3 e4} {c2 c3 g3 bb3} {e4 g3 bb3 e4}"

        # --- Cadenza & Grand Resolution (Bars 32-34) ---
        - "fortissimo"
        - "ritardando over 2 to 54"
        - "{c2 f3 a3 c4} {f4 c4 a3 c4} {a3 f3 a3 f3} {d3 f3 d3 f3}"
        - "{c2 g4 b4 d5} {f5 d5 b4 d5} {b4 g4 b4 d4} {f4 e4 d4 f4}"
        - "piano"
        - "a tempo"
        - "sustain 127"
        - "[c2 c3 e4 g4 c5] _ _ _"
