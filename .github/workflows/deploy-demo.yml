name: deploy demo

# The studio as a static site on GitHub Pages. It needs no server: scores
# compile and play in the browser, and with no sample library behind `/vpo/`
# every track plays on the synth presets.

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/core/**'
      - 'examples/**'
      - 'songs/**/*.play.yaml'
      - 'package-lock.json'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages on a private repo needs a paid plan, so this waits for the repo to
    # be public instead of failing on every push until then.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A relative base: the same build works at a domain root and under
      # /play.yaml/ on github.io.
      - name: Build the studio
        run: npm run build -w @play.yaml/web -- --base=./

      - name: Fail if the build produced no page
        run: test -s packages/web/dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
